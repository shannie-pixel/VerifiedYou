<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Settings | VerifiedYou</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap">
<link rel="stylesheet" href="app.css"></head><body>
<div class="app"><nav id="side" aria-label="Main"></nav>
<main class="main">
  <div class="top"><div><h1>Settings</h1><p class="sub">Your details as an employer on VerifiedYou.</p></div></div>
  <form class="card" id="sf"><h2>Your details</h2>
    <div class="f"><label for="nm">Your name</label><input id="nm" placeholder="e.g. Chipo Mutasa"></div>
    <div class="cols">
      <div class="f"><label for="co">Company</label><input id="co" placeholder="e.g. Acme Ltd"></div>
      <div class="f"><label for="em">Work email</label><input type="email" id="em" placeholder="you@company.com"></div></div>
    <button class="btn" type="submit">Save details</button> <span id="ok" class="sub"></span></form>
  <div class="card"><h2>Your shortlist</h2><p class="sub" style="margin-bottom:12px">This removes your saved candidates and private notes from this browser.</p><button class="btn d" id="clr">Clear shortlist and notes</button></div>
</main></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase-config.js"></script>
<script src="app.js"></script>
<script>
(async function(){
  const $=id=>document.getElementById(id);
  try{
    const {profile,authUser}=await VY.requireUser(['employer']);
    $('nm').value=profile.full_name||'';$('co').value=profile.institution||'';
    $('em').value=authUser.email||'';$('em').readOnly=true;
    $('sf').onsubmit=async e=>{
      e.preventDefault();const button=e.target.querySelector('button[type=submit]');VY.setBusy(button,true,'Saving…');
      try{
        await VY.saveProfile({full_name:$('nm').value.trim(),institution:$('co').value.trim()});
        $('ok').textContent='Saved.';VY.showMessage('Your employer details were saved.','success');
      }catch(error){VY.reportError(error)}finally{VY.setBusy(button,false)}
    };
    $('clr').onclick=async()=>{
      if(!confirm('Clear your shortlist and private notes from this account?'))return;
      try{
        const client=VY.getClient();
        const [shortlists,notes]=await Promise.all([
          client.from('employer_shortlists').delete().eq('employer_id',authUser.id),
          client.from('employer_notes').delete().eq('employer_id',authUser.id)
        ]);
        if(shortlists.error)throw shortlists.error;if(notes.error)throw notes.error;
        VY.showMessage('Your shortlist and private notes were cleared.','success');
      }catch(error){VY.reportError(error)}
    };
  }catch(error){VY.reportError(error)}
})();
</script></body></html>
