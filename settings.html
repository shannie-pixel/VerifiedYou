<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Settings | VerifiedYou</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap">
<link rel="stylesheet" href="app.css">
</head>
<body>
<div class="app">
  <nav id="side" aria-label="Main"></nav>
  <main class="main">
    <div class="top">
      <div><h1>Settings</h1><p class="sub">Choose whether employers can find your profile.</p></div>
    </div>
    <form class="card" id="settingsForm">
      <h2>Profile visibility</h2>
      <div class="f">
        <label for="visibility">Who can find your profile?</label>
        <select id="visibility">
          <option value="private">Private</option>
          <option value="public">Public</option>
        </select>
      </div>
      <button class="btn" type="submit">Save settings</button>
    </form>
  </main>
</div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase-config.js"></script>
<script src="app.js"></script>
<script>
(async function () {
  const form = document.getElementById('settingsForm');
  const visibility = document.getElementById('visibility');
  try {
    const {profile} = await VY.requireUser(['student']);
    visibility.value = profile.profile_visibility || 'private';
    form.addEventListener('submit', async function (event) {
      event.preventDefault();
      const button = form.querySelector('button[type="submit"]');
      VY.setBusy(button, true, 'Saving…');
      try {
        await VY.saveProfile({
          full_name:profile.full_name,
          institution:profile.institution,
          program:profile.program,
          study_year:profile.study_year,
          about:profile.about,
          career_interests:profile.career_interests,
          profile_visibility:visibility.value
        });
        VY.showMessage('Your profile visibility was saved.', 'success');
      } catch (error) {
        VY.reportError(error);
      } finally {
        VY.setBusy(button, false);
      }
    });
  } catch (error) {
    VY.reportError(error);
  }
})();
</script>
</body>
</html>
