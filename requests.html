<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Verification requests | VerifiedYou</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap">
<link rel="stylesheet" href="app.css"></head><body>
<div class="app"><nav id="side" aria-label="Main"></nav>
<main class="main">
  <div class="top"><div><h1>Verification requests</h1><p class="sub">Items waiting for review, and items that need your attention.</p></div></div>
  <div class="card"><h2>Pending</h2><div id="p"></div></div>
  <div class="card"><h2>Needs action</h2><div id="r"></div></div>
</main></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase-config.js"></script>
<script src="app.js"></script>
<script>
(async function(){
  try{
    await VY.requireUser(['student']);
    const achievements=await VY.getAchievements();
    const row=x=>'<div class="row"><div><b>'+esc(x.t)+'</b><small>'+meta(x)+'</small>'+
      (x.rc?'<small style="display:block;color:var(--red)">Reviewer comment: '+esc(x.rc)+'</small>':'')+
      '</div>'+(x.s==='rejected'?'<a class="btn o" href="add-achievement.html">Resubmit</a>':badge(x))+'</div>';
    document.getElementById('p').innerHTML=achievements.filter(x=>x.s==='pending').map(row).join('')||'<p class="sub">No pending requests.</p>';
    document.getElementById('r').innerHTML=achievements.filter(x=>x.s==='rejected').map(row).join('')||'<p class="sub">Nothing needs your attention.</p>';
  }catch(error){VY.reportError(error)}
})();
</script></body></html>
